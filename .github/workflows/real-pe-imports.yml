name: Real PE imports

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-pe-imports.yml"
      - "src/native/pe/**"
      - "src/domain/native/binaryImport*.ts"
      - "src/domain/native/peImports.ts"
      - "src/domain/native/peOrdinalNames.ts"
      - "src/application/binaryDiagnostics/PeImports*.ts"
      - "src/contracts/native/binaryDiagnosticsToolContracts.ts"
      - "src/composition/binaryDiagnostics.ts"
      - "src/cli/binaryDiagnosticsCommands.ts"
      - "src/server/registerPeImportsTool.ts"
      - "src/server/createServer.ts"
      - "src/cli.ts"
      - "src/cliCommandNames.ts"
      - "src/contracts/toolContracts.ts"
      - "src/contracts/toolEffects.ts"
      - "src/artifacts/readStableArtifact*.ts"
      - "src/artifacts/ArtifactReader.ts"
      - "scripts/verify-pe-imports.mjs"
      - "scripts/lib/mcp-verifier-results.mjs"
      - "scripts/rea.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: real-pe-imports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=768
  HUSKY: "0"

jobs:
  real-pe-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - name: Install fixture producers and independent oracles
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 llvm-18
          oracle_python_root="${RUNNER_TEMP}/rea-pefile-oracle"
          python3 -m venv "${oracle_python_root}"
          "${oracle_python_root}/bin/python" -m pip install --disable-pip-version-check \
            'pefile==2024.8.26'
          echo "REA_VERIFY_PEFILE_PYTHON=${oracle_python_root}/bin/python" >> "${GITHUB_ENV}"
      - run: npm ci
      - name: Verify mingw-w64 PE fixtures against pefile and llvm-readobj through CLI and MCP
        run: npm run verify:pe-imports
